<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WazaMate</title>
<style>
:root{
  --page:#15171c; --bench:#1c1f25; --line:#2c3038; --screen:#06080b;
  --text:#ece9e2; --mute:#8b909a; --wire:#c9cdd4;
  --drive:#f2a52b; --mod:#4d9ef7; --delay:#3ec47a; --reverb:#ff7b4a; --amp:#e5484d; --eq:#ecd13f; --dyn:#9aa7b4; --amb:#a98bfa;
  --ok:#3ec47a; --untested:#f2a52b; --flag:#ff5a52;
  --font:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --num:"Consolas","SF Mono","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font:15px/1.4 var(--font);font-stretch:95%;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;letter-spacing:.01em;font-stretch:80%;margin-right:6px}
.brand small{font-size:11px;font-weight:400;color:var(--mute);margin-left:6px}
.patches{display:flex;gap:6px}
.patches button{min-width:44px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#20242b;font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.patches button span{font-size:12px;font-weight:400;color:var(--mute);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.patches button.on{background:var(--text);color:#111;border-color:var(--text)}
.patches button.on span{color:#444}
.grow{flex:1}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#20242b;font-weight:600}
.btn:hover{border-color:#4a505c}
.btn.primary{background:#2d6cdf;border-color:#2d6cdf}
.btn.live{background:#17301f;border-color:#2c6a41;color:#9be7b6}
.btn.mute[aria-pressed=true]{background:var(--flag);border-color:var(--flag);color:#190606}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:#333842;position:relative;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#aab;transition:left .12s}
.switch input:checked{background:var(--untested)}
.switch input:checked::after{left:16px;background:#111}
.chip{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
.chip.live b{background:var(--ok)} .chip.reading b{background:var(--untested)} .chip.none b{background:var(--flag)}

/* ---------- chain screen ---------- */
.lcd{margin:14px 18px 0;background:var(--screen);border:1px solid #30343d;border-radius:14px;box-shadow:inset 0 0 0 4px #000,inset 0 0 60px rgba(80,120,190,.07);padding:14px 20px 8px}
.lcd-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #1d2027;padding-bottom:8px}
.lcd-num{font-size:26px;font-weight:700}
.lcd-name{font-size:26px;font-weight:300}
.lcd-head select{background:#11141a;border:1px solid #2a2e37;border-radius:6px;padding:3px 6px;font-size:13px}
.lcd-head label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.path{display:flex;align-items:center;padding:14px 4px 22px;overflow-x:auto;min-height:170px}
.path>.tw,.path>.pair{margin-bottom:0}
.wire{flex:1 1 16px;min-width:12px;height:2px;background:var(--wire)}
.node{width:30px;height:30px;border-radius:50%;border:2px solid var(--wire);display:grid;place-items:center;flex:none;color:var(--wire)}
.node svg{width:16px;height:16px}
.tw{position:relative;flex:none;width:60px;height:60px}
.tile{width:60px;height:60px;border-radius:11px;border:2px solid var(--c);background:#0c0f13;color:var(--c);display:grid;place-items:center;padding:0;box-shadow:0 0 14px color-mix(in srgb,var(--c) 25%,transparent)}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tw.off .tile{--c:#5a5f6a!important;box-shadow:none}
.tw.off .tcap{color:#666c77}
.tw.cur .tile{outline:2px solid #fff;outline-offset:3px;background:#161a21}
.tcap{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:104px;text-align:center;font-size:11px;line-height:1.15;color:var(--mute);pointer-events:none}
.tcap b{display:block;color:var(--text);font-size:12px;font-weight:600}
.grp{position:relative;flex:none;display:flex;align-items:center;padding:16px 26px 44px;margin-top:28px;border:1px dashed #4a505c;border-radius:16px}
.grp .wire{flex:none;width:52px}
.grp .tcap{width:96px}
.gcap{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--mute);border:1px solid #23272f;border-radius:20px;padding:2px 9px;background:#0b0d11}
.gcap i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:6px}
.led1{background:#35d07f!important;box-shadow:0 0 8px #35d07f} .led2{background:#ff4b3e!important;box-shadow:0 0 8px #ff4b3e} .led3{background:#ff9d2e!important;box-shadow:0 0 8px #ff9d2e}
.pair{display:flex;align-items:center;flex:none}
.pair .wire{flex:none;width:34px}

/* ---------- stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px;align-items:start}
.stage-main{background:var(--bench);border:1px solid var(--line);border-radius:14px;padding:26px;min-height:330px;display:flex;flex-direction:column;align-items:center;gap:22px}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--bench);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--mute)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:520px;overflow:auto}
.types button{padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:#20242b;font-size:12px;text-align:left}
.types button.on{background:var(--text);color:#111;border-color:var(--text);font-weight:600}
.colors{display:grid;gap:4px;font-size:12px;margin-top:10px}
.colors div{display:flex;gap:8px;align-items:center;color:var(--mute)}
.colors div.on{color:var(--text)}
.colors i{width:10px;height:10px;border-radius:50%;flex:none}
.hprow{display:flex;gap:14px;align-items:flex-start}
.hprow .note{font-size:12px;color:var(--mute);flex:1}
.hprow .btn{height:30px;font-size:12px;padding:0 10px;margin-top:6px}
.more{width:100%;display:flex;flex-wrap:wrap;gap:16px 20px;justify-content:center;padding-top:18px;border-top:1px dashed var(--line)}
.more h4{flex-basis:100%;margin:0;font-size:12px;font-weight:600;color:var(--mute);text-align:center}
.legend{font-size:12px;color:var(--mute);display:grid;gap:5px}
.legend span{display:flex;gap:8px;align-items:center}

/* ---------- controls ---------- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle;cursor:pointer;border:2px solid var(--untested);background:transparent;padding:0;flex:none}
.dot[data-st=ok]{background:var(--ok);border-color:var(--ok)}
.dot[data-st=flag],.dot[data-st=bad]{background:var(--flag);border-color:var(--flag)}
.ctl{--kc:var(--acc,#e9e6df);color:var(--ink,var(--text))}
body.gate .ctl:not([data-st=ok]){opacity:.42}
body.gate .ctl:not([data-st=ok]) .dot{opacity:1}
.knob{width:78px;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;cursor:ns-resize;border-radius:8px}
.k-dial{position:relative;width:62px;height:62px}
.k-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 225deg,var(--track,rgba(0,0,0,.45)) var(--a,0deg),var(--kc) var(--a,0deg) var(--b,0deg),var(--track,rgba(0,0,0,.45)) var(--b,0deg) 270deg,transparent 270deg);-webkit-mask:radial-gradient(circle,transparent 26px,#000 27px);mask:radial-gradient(circle,transparent 26px,#000 27px)}
.k-cap{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#5b5f68,#1b1d21 62%);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);transform:rotate(calc(-135deg + var(--t,0)*270deg))}
.k-cap i{position:absolute;left:50%;top:3px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:#fff}
.k-val{font:600 13px var(--num);margin-top:3px;min-height:18px;white-space:nowrap;cursor:text}
.k-val input{width:58px;font:600 13px var(--num);background:#000;color:#fff;border:1px solid #666;border-radius:4px;text-align:center;padding:0}
.k-lab{overflow-wrap:anywhere;max-width:100%;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-align:center;line-height:1.15;opacity:.9}
.knob.big{width:96px}.knob.big .k-dial{width:78px;height:78px}.knob.big .k-ring{-webkit-mask:radial-gradient(circle,transparent 34px,#000 35px);mask:radial-gradient(circle,transparent 34px,#000 35px)}
/* knob cap styles */
[data-cap=cream] .k-cap{background:radial-gradient(circle at 35% 28%,#fff8e2,#d9c9a0 70%);clip-path:polygon(50% -8%,68% 30%,100% 62%,82% 100%,18% 100%,0 62%,32% 30%)}
[data-cap=cream] .k-cap i{background:#3a2a14}
[data-cap=skirt] .k-cap{background:radial-gradient(circle,#c9ccd1 0 34%,#111 36% 100%)}
[data-cap=skirt] .k-cap i{background:#fff;height:9px}
[data-cap=gold] .k-cap{background:radial-gradient(circle,#e8c873 0 38%,#141414 40% 100%)}
[data-cap=gold] .k-cap i{background:#fff}
[data-cap=silver] .k-cap{background:conic-gradient(#f4f4f4,#8d9299,#f4f4f4,#8d9299,#f4f4f4)}
[data-cap=silver] .k-cap i{background:#111}
.sel{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;min-width:96px}
.sel span{display:flex;align-items:center}
.sel select{background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 6px;font-size:12px;font-weight:400;letter-spacing:0}
.tog{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font-size:10.5px;font-weight:600;letter-spacing:.04em;min-width:64px}
.tog .t-sw{width:40px;height:20px;border-radius:4px;background:#0a0a0a;border:1px solid rgba(255,255,255,.3);position:relative}
.tog .t-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:14px;border-radius:2px;background:linear-gradient(#eee,#999);transition:left .1s}
.tog[aria-pressed=true] .t-sw::after{left:20px}
.tog .t-txt{font:600 11px var(--num);min-height:14px}
.tog>span:last-child{display:flex;align-items:center}
.vslide{display:flex;flex-direction:column;align-items:center;gap:6px;width:46px}
.vslide input{writing-mode:vertical-lr;direction:rtl;height:150px;width:22px;accent-color:var(--acc,#eee)}

/* ---------- devices ---------- */
.dev{position:relative;max-width:100%}
.krow{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;align-items:flex-start}
.srow{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:center;align-items:flex-end;margin-top:14px}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;font-size:11px;font-weight:600}
.foot .f-led{width:12px;height:12px;border-radius:50%;background:#3a1010;border:1px solid rgba(0,0,0,.6)}
.foot[aria-pressed=true] .f-led{background:#ff3b30;box-shadow:0 0 12px #ff3b30,0 0 2px #fff inset}
.foot .f-btn{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aeb3bb 45%,#5e636b);box-shadow:0 0 0 5px rgba(0,0,0,.35),0 6px 10px rgba(0,0,0,.5)}
.foot:active .f-btn{transform:translateY(2px)}
.foot>span:last-child{display:flex;align-items:center}
/* stompbox */
.stomp{width:var(--w,340px);border-radius:20px;padding:20px 18px 20px;color:var(--ink);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 86%,#fff),var(--c) 38%,color-mix(in srgb,var(--c) 74%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.35),0 22px 34px rgba(0,0,0,.55)}
.stomp .plate{margin:18px 0 14px;padding:10px 0;border-top:2px solid currentColor;border-bottom:2px solid currentColor;text-align:center}
.stomp .plate b{display:block;font-size:26px;font-weight:700;font-stretch:78%;letter-spacing:.02em;line-height:1}
.stomp .plate span{font-size:11px;letter-spacing:.18em;font-weight:600}
.stomp .lcdwin{margin:0 auto 14px;width:150px;text-align:center}
.stomp.one .knob{width:120px}
/* rack */
.rack{width:min(100%,900px);padding:18px 62px;border-radius:5px;background:linear-gradient(#32363c,#1e2126);border:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 30px rgba(0,0,0,.5);--ink:#dfe3e8;color:var(--ink);--track:rgba(255,255,255,.12)}
.rack::before,.rack::after{content:"";position:absolute;top:0;bottom:0;width:44px;background:radial-gradient(circle at 50% 22px,#0a0a0a 5px,transparent 6px),radial-gradient(circle at 50% calc(100% - 22px),#0a0a0a 5px,transparent 6px),linear-gradient(#3a3e45,#24272c)}
.rack::before{left:0;border-right:1px solid #000}.rack::after{right:0;border-left:1px solid #000}
.rack .rhead{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.rack .rname b{display:block;font-size:20px;font-weight:700;letter-spacing:.06em}
.rack .rname span{font-size:10.5px;letter-spacing:.2em;color:#9aa0a8}
.rack .krow{justify-content:flex-start}
.rack .srow{justify-content:flex-start}
.pwr{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;font-size:10px;font-weight:600;letter-spacing:.1em;color:inherit;padding:0}
.pwr .p-btn{width:34px;height:34px;border-radius:5px;background:linear-gradient(#555a62,#2b2e33);border:1px solid #000;display:grid;place-items:center}
.pwr .p-btn::after{content:"";width:10px;height:10px;border-radius:50%;background:#3a1010}
.pwr[aria-pressed=true] .p-btn::after{background:var(--acc,#ff3b30);box-shadow:0 0 10px var(--acc,#ff3b30)}
.pwr>span:last-child{display:flex;align-items:center}
.lcdwin{background:#050607;border:2px solid #000;border-radius:4px;box-shadow:inset 0 0 12px #000;padding:6px 14px;font:700 30px/1 var(--num);color:var(--acc,#ff5038);text-shadow:0 0 10px var(--acc,#ff5038);letter-spacing:.06em;min-width:150px;text-align:right}
.lcdwin small{font-size:11px;margin-left:6px;opacity:.8}
.springs{flex:1;height:56px;border:2px solid #000;border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.55) 3px 4px) 0 12px/100% 6px no-repeat,repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.55) 3px 4px) 0 25px/100% 6px no-repeat,repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.55) 3px 4px) 0 38px/100% 6px no-repeat,#0b0c0e}
/* tape echo */
.tape{width:min(100%,760px);border-radius:10px;padding:0;background:#22352c;border:1px solid #000;box-shadow:0 20px 34px rgba(0,0,0,.55);overflow:hidden;--ink:#22352c;color:var(--ink)}
.tape .deck{background:#0e1512;padding:18px 26px;display:flex;align-items:center;gap:26px;border-bottom:3px solid #000}
.reel{width:92px;height:92px;border-radius:50%;flex:none;background:radial-gradient(circle,#ddd 0 9px,#222 10px 13px,transparent 14px),conic-gradient(#1b1b1b 0 40deg,#7a4a2a 40deg 120deg,#1b1b1b 120deg 160deg,#7a4a2a 160deg 240deg,#1b1b1b 240deg 280deg,#7a4a2a 280deg 360deg);border:3px solid #c8ccd0}
.tape.run .reel{animation:spin var(--spd,3s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.heads{flex:1;height:44px;border-top:3px solid #7a4a2a;display:flex;justify-content:space-around;align-items:flex-start}
.heads i{width:22px;height:30px;background:linear-gradient(#bbb,#666);border-radius:0 0 4px 4px}
.tape .face{background:linear-gradient(#efe6cf,#d9cfb4);padding:18px 26px 20px;--track:rgba(0,0,0,.18);--acc:#22352c}
.tape .rhead{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.tape .rname b{font-size:22px;font-weight:700;letter-spacing:.05em;display:block}
.tape .rname span{font-size:10.5px;letter-spacing:.2em}
.tape .pwr .p-btn{background:linear-gradient(#444,#111)}
.tape .pwr[aria-pressed=true] .p-btn::after{background:#ff4a3d;box-shadow:0 0 10px #ff4a3d}
.tape .sel select{background:#22352c}
/* amp */
.amp{width:min(100%,920px);border-radius:12px;padding:16px;background-color:var(--tolex);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:5px 5px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),0 24px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.amp::before{content:"";position:absolute;top:-9px;left:50%;width:200px;height:12px;margin-left:-100px;border-radius:8px 8px 0 0;background:#0b0b0b;border:1px solid #333;border-bottom:0}
.amp-grille{height:150px;border-radius:5px;border:3px solid var(--pipe);background:var(--grille);display:grid;place-items:center;box-shadow:inset 0 0 30px rgba(0,0,0,.55)}
.amp-badge{padding:5px 20px;border-radius:3px;background:var(--badge);color:var(--badge-ink);font-size:24px;font-weight:700;font-stretch:80%;letter-spacing:.1em;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.amp-panel{padding:14px 22px 12px;border-radius:3px;background:var(--panel);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.4)}
.amp-jewel{width:26px;height:26px;border-radius:50%;margin-top:18px;background:radial-gradient(circle at 35% 30%,#fff,var(--jewel) 40%,#000 130%);box-shadow:0 0 14px var(--jewel),0 0 0 3px #222}
.amp.top{flex-direction:column-reverse}
.amp-flat{--tolex:#3b3f45;--pipe:#8a9098;--grille:radial-gradient(#0c0d0f 1.6px,transparent 2px) 0 0/8px 8px,#5d636b;--badge:#1d2126;--badge-ink:#cfd6de;--panel:linear-gradient(#cfd4da,#a9afb7);--ink:#15181c;--jewel:#3aa0ff;--track:rgba(0,0,0,.2);--acc:#15181c}
.amp-clean{--tolex:#101113;--pipe:#c9ccd1;--grille:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 4px),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 4px),linear-gradient(#aab4c2,#8b96a6);--badge:#e9edf2;--badge-ink:#111;--panel:linear-gradient(#17181b,#0b0b0d);--ink:#f1f1f1;--jewel:#ff3030;--track:rgba(255,255,255,.14);--acc:#fff}
.amp-crunch{--tolex:#cdbf9c;--pipe:#f3ead3;--grille:repeating-linear-gradient(60deg,rgba(60,30,10,.55) 0 2px,transparent 2px 18px),repeating-linear-gradient(-60deg,rgba(60,30,10,.55) 0 2px,transparent 2px 18px),#8a5a34;--badge:#f3ead3;--badge-ink:#3a2412;--panel:linear-gradient(#a8552b,#7c3a1b);--ink:#fff3dd;--jewel:#ff7a1a;--track:rgba(0,0,0,.3);--acc:#fff3dd}
.amp-crunch.amp{background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.3px)}
.amp-lead{--tolex:#0d0d0e;--pipe:#f2f2f2;--grille:repeating-linear-gradient(45deg,rgba(0,0,0,.6) 0 4px,transparent 4px 8px),repeating-linear-gradient(-45deg,rgba(0,0,0,.6) 0 4px,transparent 4px 8px),#8d7a55;--badge:#f5f5f5;--badge-ink:#111;--panel:linear-gradient(#e7c66d,#b9923a);--ink:#17120a;--jewel:#ff2a2a;--track:rgba(0,0,0,.25);--acc:#17120a}
.amp-brown{--tolex:#2a1c14;--pipe:#d8c9a6;--grille:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 3px,transparent 3px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 3px,transparent 3px 7px),#5a3f2a;--badge:#b08d3c;--badge-ink:#1a1206;--panel:linear-gradient(#b99a4f,#806424);--ink:#1a1206;--jewel:#ffb020;--track:rgba(0,0,0,.28);--acc:#1a1206}
/* 3D stage */
.amb{width:min(100%,820px);display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:center;--acc:var(--amb)}
.amb svg{width:300px;height:300px}
.amb .panel{display:flex;flex-direction:column;gap:18px}
.geq{--acc:#8fe3ff}
.sysgrid{width:100%;display:grid;gap:14px}
.sysgrid .rack{width:100%}

/* ---------- log ---------- */
.logbar{border-top:1px solid var(--line);background:#111317}
.logbar summary{padding:8px 18px;font-size:13px;color:var(--mute);cursor:pointer;display:flex;gap:14px;align-items:center}
.logbar summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--num);font-size:12px}
.logtools{display:flex;gap:8px;padding:0 18px 8px;flex-wrap:wrap}
.logtools input{flex:1;min-width:240px;background:#0a0b0d;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px var(--num)}
.logtools .btn{height:30px;font-size:12px}
#log{height:190px;overflow:auto;padding:0 18px 12px;font:12px/1.5 var(--num);white-space:pre-wrap}
#log .tx{color:#9ecbff} #log .rx{color:#a6e9b8} #log .pv{color:#8b909a} #log .er{color:#ff9d96}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#f1eee6;color:#111;padding:10px 16px;border-radius:10px;font-size:14px;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.toast.show{opacity:1}
@media (max-width:900px){.stage{grid-template-columns:1fr}.amb{grid-template-columns:1fr}.rack{padding:16px 54px}}
@media (prefers-reduced-motion:reduce){.tape.run .reel{animation:none}}

/* ---------- advanced menu and testing tools ---------- */
.menu{position:relative}
.menu summary{list-style:none;display:flex;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu-body{position:absolute;right:0;top:44px;z-index:8;width:270px;background:#20242b;border:1px solid #3a3f4a;border-radius:10px;padding:12px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.menu-body p{margin:8px 0 0;font-size:12px;color:var(--mute)}
.menu-body .switch{color:var(--text)}
body:not(.tools) .dot,body:not(.tools) .toolonly,body:not(.tools) .logbar{display:none}

/* ---------- preset library ---------- */
.lcd-head{flex-wrap:wrap;row-gap:8px}
.libbar{display:flex;gap:6px;align-items:center}
.libbar select{max-width:210px;height:30px}
.btn.sm{height:30px;font-size:13px;padding:0 10px}
.menu-body.list{width:210px;padding:6px;display:grid;top:36px}
.menu-body.list button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.menu-body.list button:hover{background:#2c313a}
.menu-body.list hr{border:0;border-top:1px solid #3a3f4a;margin:4px 0;width:100%}
.path>.pair+.wire,.path .pair .wire{min-width:20px}

/* ---------- icons and small screens ---------- */
html,body{height:auto;overflow-x:clip;max-width:100%}
body{min-height:100dvh}
button,summary,select{touch-action:manipulation}
.uic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.ic{display:inline-flex;align-items:center;gap:7px}
.btn.ic.only{padding:0;width:34px;justify-content:center}
.menu-body.list button{display:flex;align-items:center;gap:9px}
.menu-body.list .mhead{font-size:12px;color:var(--mute);padding:6px 10px}
.menu-body.list b{display:inline-block;min-width:14px}
.stage-main,.card,.lcd{min-width:0}
.dev,.amb svg{max-width:100%}
@media (max-width:720px){
  body{font-size:14px}
  .bar{padding:8px 10px;gap:6px}
  .brand{font-size:17px;margin-right:2px}.brand small{display:none}
  .bar .lbl,.patches button span,#sync span{display:none}
  .bar .btn{height:36px;padding:0 9px}
  .bar .btn.ic{width:38px;padding:0;justify-content:center}
  .patches{gap:3px;order:5;width:100%}
  .patches button{flex:1;min-width:0;justify-content:center;height:36px}
  .chip{padding:6px}.chip b{margin:0}
  .lcd{margin:10px 8px 0;padding:10px 10px 4px;border-radius:12px}
  .lcd-num,.lcd-name{font-size:19px}
  .lcd-head .grow{display:none}
  .libbar{width:100%}.libbar select{flex:1;max-width:none;min-width:0;height:34px}
  .btn.sm{height:34px}
  #chainlab{width:100%;justify-content:space-between}#chainlab .lbl{display:inline}
  .path{flex-wrap:wrap;overflow:visible;min-height:0;padding:14px 0 40px;row-gap:46px;justify-content:center}
  .path>.wire,.path .pair .wire,.pair .wire{flex:none;width:10px;min-width:10px}
  .tw,.tile{width:46px;height:46px}.tile{border-radius:9px}.tile svg{width:24px;height:24px}
  .tcap{top:51px;width:60px;font-size:9.5px;overflow:hidden}.tcap b{font-size:10.5px;white-space:nowrap}
  .tcap{white-space:nowrap;text-overflow:ellipsis}
  .stage{padding:10px 8px;gap:10px}
  .stage-main{padding:14px 10px;min-height:0;border-radius:12px}
  .amp{padding:10px}.amp-grille{height:84px}.amp-panel{padding:12px 8px;justify-content:center;gap:12px 6px}.amp-jewel{display:none}
  .rack{padding:14px 30px}.rack::before,.rack::after{width:22px}
  .rack .rhead{flex-wrap:wrap;gap:10px}.rack .krow,.rack .srow{justify-content:center}
  .lcdwin{font-size:24px;min-width:110px}
  .tape .deck{padding:12px;gap:12px}.reel{width:60px;height:60px}.tape .face{padding:14px 10px}
  .stomp{padding:16px 10px}
  .amb{gap:10px;justify-items:center}.amb .panel{align-items:center}
  .types{max-height:200px}
  .menu-body{position:fixed;left:10px;right:10px;top:auto;bottom:10px;width:auto;z-index:20}
  .menu-body.list{width:auto;top:auto}.menu-body.list button{padding:12px 10px;font-size:15px}
  .toast{left:10px;right:10px;transform:none;max-width:none;bottom:14px}
  .logtools input{min-width:0}
}

/* ---------- battery, tempo bar, help dialog ---------- */
.batt[hidden]{display:none}
.batt{display:inline-flex;align-items:center;width:30px;height:15px;border:1.5px solid var(--mute);border-radius:3px;padding:1.5px;position:relative;flex:none}
.batt::after{content:"";position:absolute;left:100%;top:3.5px;width:2.5px;height:5px;background:var(--mute);border-radius:0 2px 2px 0}
.batt i{display:block;height:100%;width:var(--fill,0%);border-radius:1px;background:var(--ok);transition:width .3s}


.tempo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#20242b}
.tapbtn{height:38px;min-width:62px;font-weight:700;letter-spacing:.06em}
.tapbtn:active{background:var(--text);color:#111}
.tempo .bpm{font:13px var(--num);color:var(--mute);min-width:74px}
.tempo .bpm b{font-size:17px;color:var(--text)}
.tempo .bpm b.dim{color:#555b66}
.divs{display:flex;gap:4px}
.divs button{height:32px;min-width:46px;border-radius:7px;border:1px solid var(--line);background:#272c34;font:12px var(--num)}
.divs .free{font-weight:700;letter-spacing:.04em}
.otherdiv{font:12px var(--num);color:var(--mute);padding-left:4px}
.divs button.on{background:var(--text);color:#111;border-color:var(--text);font-weight:700}
.divs button:disabled{opacity:.4;cursor:default}

.help{border:1px solid #3a3f4a;border-radius:14px;background:var(--bench);color:var(--text);max-width:520px;padding:22px 24px;font:15px/1.5 var(--font)}
.help::backdrop{background:rgba(0,0,0,.65)}
.help h2{margin:0 0 12px;font-size:19px}
.help p{margin:0 0 11px;color:#c3c8d0}
.help a{color:#7fb5ff}
.help .btn{margin-top:6px}
@media (max-width:720px){
  .batt{display:none}
  .tempo{gap:8px;padding:8px}
  .tempo .bpm{min-width:0}
  .divs{flex-wrap:wrap;justify-content:center}
  .help{margin:auto 10px;padding:18px}
}

.pastebox{width:100%;box-sizing:border-box;background:#0d1014;color:var(--text);border:1px solid #3a3f4a;border-radius:8px;padding:10px;font:12.5px/1.5 var(--num);resize:vertical}
.prow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* ---------- LLM dialog ---------- */
#llm{max-width:560px}
.lrow[hidden]{display:none}
.lrow{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.lrow span{flex:none;width:76px;font-size:13px;color:var(--mute)}
.lrow .btn{flex:none;height:38px;padding:0 12px}
.lrow input,.lrow select{flex:1;min-width:0;background:#0d1014;color:var(--text);border:1px solid #3a3f4a;border-radius:8px;padding:9px 10px;font:14px var(--font)}
.help .note{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.help a{word-break:break-all}
.reason{max-height:230px;overflow:auto;white-space:pre-wrap;font-size:13.5px;line-height:1.5;color:#c3c8d0;border-left:2px solid var(--line);padding-left:12px;margin:0 0 12px}
.reason:empty{display:none}

</style>
</head>
<body>
<header class="bar">
  <div class="brand">WazaMate<small>v0.16</small></div>
  <div class="patches" id="patches" role="group" aria-label="Patch"></div>
  <div class="grow"></div>
  <span class="chip preview" id="sync"><b></b><span></span></span>
  <span class="batt" id="battery" role="img" hidden><i></i></span>
  <label class="switch toolonly" title="Lets untested controls send to the headphones"><input type="checkbox" id="test">Test mode</label>
  <button class="btn" id="readbtn" type="button" hidden title="Ask the headphones for their current settings">Read state</button>
  <button class="btn" id="hs" type="button" hidden title="Send the two CONNECT messages again">Send CONNECT</button>
  <button class="btn ic" id="sysbtn" type="button" data-ic="gear" aria-label="System settings" title="System settings"><span class="lbl">System</span></button>
  <details class="menu" id="adv"><summary class="btn ic" data-ic="tools" aria-label="Advanced" title="Advanced"><span class="lbl">Advanced</span></summary>
    <div class="menu-body"><label class="switch"><input type="checkbox" id="tools">Testing tools</label>
    <p>Shows the MIDI log, test marks on every control, Test mode, Send CONNECT and Read state.</p></div>
  </details>
  <button class="btn mute ic" id="mute" type="button" data-ic="mute" aria-pressed="false" aria-label="Mute" title="Mute"><span class="lbl">Mute</span></button>
  <button class="btn primary ic" id="connect" type="button" data-ic="bt" aria-label="Connect headphones" title="Connect headphones"><span class="lbl">Connect headphones</span></button>
</header>
<section class="lcd" aria-label="Signal chain">
  <div class="lcd-head">
    <span class="lcd-num" id="lcdnum"></span><span class="lcd-name" id="lcdname"></span>
    <div class="grow"></div>
    <div class="libbar">
      <select id="preset" aria-label="Preset library" title="Load a preset from your library"></select>
      <button class="btn sm ic only" id="psave" type="button" data-ic="save" aria-label="Save preset" title="Save the current sound over the selected preset, or as a new one"></button>
      <details class="menu" id="pmenu"><summary class="btn sm ic only" data-ic="dots" aria-label="Preset actions" title="Preset actions"></summary>
        <div class="menu-body list">
          <button type="button" id="pnew" data-ic="plus">New from current sound</button><button type="button" id="pinit" data-ic="blank" title="Switch every effect off and put every control back to its default, as a blank canvas">Start from an empty patch</button>
          <button type="button" id="pdup" data-ic="copy">Duplicate</button><button type="button" id="pren" data-ic="edit">Rename</button><button type="button" id="pdel" data-ic="trash">Delete</button>
          <hr><button type="button" id="pimp" data-ic="imp">Import file</button><button type="button" id="pexp" data-ic="exp">Export this preset</button><button type="button" id="pexpall" data-ic="exp">Export whole library</button>
          <hr><button type="button" id="pgen" data-ic="spark" title="Describe a sound and have an LLM build the patch for you. Needs a free API key, set up once.">New patch from an LLM</button>
          <button type="button" id="pllmset" data-ic="gear" title="Choose which LLM to use and store your API key in this browser">LLM settings</button>
          <hr><button type="button" id="pbackup" data-ic="store" title="Read all six memories off the headphones and save them to a file, so a mistaken store can be undone">Back up headphone memories</button>
          <button type="button" id="ppaste" data-ic="paste" title="Paste a reply from an LLM, explanation and all. The patch is pulled out of the text and loaded so you can hear it.">Paste a patch from an LLM</button>
          <button type="button" id="pllm" data-ic="spark" title="Copies a ready-made prompt: the full list of parameters plus the patch you are on. Paste it into any LLM, describe the sound you want, and bring its reply back with Import file. Nothing is sent anywhere by WazaMate.">Copy prompt for an LLM</button>
        </div>
      </details>
      <details class="menu" id="smenu"><summary class="btn sm ic only" data-ic="store" aria-label="Store in a headphone memory" title="Store the current sound in a headphone memory"></summary>
        <div class="menu-body list" id="slist"></div>
      </details>
      <input type="file" id="pfile" accept=".json,application/json" hidden>
    </div>
    <label class="ctl" id="chainlab"><span class="lbl">Chain order</span> <select id="chainsel" aria-label="Chain order" title="Chain order"></select></label>
  </div>
  <div class="path" id="path"></div>
</section>
<main class="stage">
  <div class="stage-main" id="main"></div>
  <aside class="side" id="side"></aside>
</main>
<details class="logbar" id="logbar">
  <summary>MIDI log <span id="lastlog"></span></summary>
  <div class="logtools">
    <input id="raw" placeholder="Hex bytes. Full message, or address + data for a DT1" aria-label="Raw hex bytes">
    <button class="btn" id="senddt1" type="button">Send as DT1</button>
    <button class="btn" id="sendraw" type="button">Send as typed</button>
    <button class="btn" id="probe" type="button" title="Briefly switch the headphones into battery mode and tuner mode, logging whatever they send back. Your sound cuts out for about fifteen seconds.">Probe battery and tuner</button>
    <button class="btn" id="copylog" type="button">Copy log</button>
    <button class="btn" id="copymarks" type="button">Copy test results</button>
  </div>
  <div id="log"></div>
</details>
<dialog class="help" id="help"><div id="helpbox"></div></dialog>
<dialog class="help" id="llm"><div id="llmbox"></div></dialog>
<div class="toast" id="toast" role="status"></div>

      want.disabled = false;

      want.focus();

    h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'),

function sysDev() {

function deviceFor(b) {

  if (b === 'ns') return stomp(b, '#6d7782', ids, { title: 'GATE' });

  if (b === 'mod' || b === 'fx') {
    const g = FX_GROUP[t];
    if (g === 'GEQ') return geq(b, ids);
    if (g === 'PEQ') return rack(b, ids, { acc: '#ecd13f', max: 12 });

  }

  return rack(b, ids);
}

/* ------------------------------------------------------------ side cards */
function typeCard(b) {

  });
  const c = h('div', { class: 'card ctl', 'data-st': statusOf(s.type) }, h('h3', {}, b === 'amp' ? 'Amp type' : s.label + ' type', dotEl(s.type)), grid);

/* ------------------------------------------------------------ render */
function renderDetail() {

  if (dev.scale) main.append(h('div', { class: 'more' }, h('h4', {}, 'User scale (harmony per note)'), dev.scale.map(id => knob(id))));
  if ((b === 'mod' || b === 'fx') && !paramsFor(b).length) main.append(h('p', { style: 'color:var(--mute)' }, 'Roland\'s map has no parameters for this type.'));

let rq = 0;
function scheduleRender() { if (!rq) rq = requestAnimationFrame(() => { rq = 0; render(); }); }

let lq = 0;
function scheduleLog() {
  if (lq) return;
  lq = requestAnimationFrame(() => {
    lq = 0; const last = logs[logs.length - 1]; $('#lastlog').textContent = last ? last.line : '';
    if (!$('#logbar').open) return;
    const box = $('#log'); box.textContent = '';

    box.scrollTop = box.scrollHeight;

}
const HELP = {
  browser: () => {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return {

        ? ['Apple does not allow Web Bluetooth in Safari or in Chrome on iOS, so no browser Apple ships can reach the headphones. This is not something WazaMate can work around.',
           'Everything else works here: build patches, keep a library, import and export files. They will play as soon as you open the same library on a desktop.',

        : ['Connecting needs Web Bluetooth, which this browser does not have. Chrome or Edge on Windows, macOS or Linux will work, as will Chrome on Android. Firefox does not support it on any platform.',

function showHelp(kind) {

function renderBattery() {
  const e = $('#battery'), v = state.battery;
  // Nothing sensible to show unless a non-zero byte arrived: the format is unverified.
  if (v == null || v === 0 || v > 100) { e.hidden = true; return; }
  e.hidden = false;
  const pct = v <= 4 ? [0, 25, 50, 75, 100][v] : v;
  e.style.setProperty('--fill', pct + '%');
  e.title = 'Headphone battery, about ' + pct + '%. Roland\'s app shows four levels, and the raw value here is ' + v + '. The exact meaning is not confirmed.';

/** Puts the headphones into their battery and tuner modes briefly, logging whatever they send. */
async function probeModes() {
  if (!link.connected) return toast('Connect the headphones first.');
  if (!confirm('This switches the headphones into their battery mode, then their tuner mode, then back to normal play.\n\nYour sound may cut out for about fifteen seconds. Play and hold a note when the log says to.\n\nNothing is written to any patch. Run it?')) return;
  const mark = t => log('rx', null, '--------- ' + t + ' ---------');
  try {
    mark('probe: battery mode');
    await tx(dt1(RUNNING_MODE, [3]), 'Running mode 3 (battery)');
    await sleep(2500);
    await read(BATTERY_ADDR, 1, 1200);
    mark('probe: tuner mode, PLAY AND HOLD A NOTE NOW');
    await tx(dt1(RUNNING_MODE, [1]), 'Running mode 1 (tuner)');
    await sleep(8000);
    await read([0x7F, 0x00, 0x03, 0x00], 2, 1200);
    await sleep(1500);
  } finally {
    await tx(dt1(RUNNING_MODE, [0]), 'Running mode 0 (play)');
    mark('probe finished, back in play mode');
  }
  toast('Probe finished. Copy the log and send it over.');
}
let toastTimer = null;

function init() {
